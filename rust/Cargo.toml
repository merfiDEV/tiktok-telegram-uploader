[package]
name = "tiktokautouploader-rs"
version = "1.0.0"
edition = "2021"
description = "Rust orchestration layer for tiktokautouploader; the stealth browser stays in the Node sidecar"
license = "MIT"

[lib]
name = "tiktokautouploader"
path = "src/lib.rs"

[[bin]]
name = "tiktok-upload"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
